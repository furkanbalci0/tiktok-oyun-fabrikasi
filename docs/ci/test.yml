name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Testler TikTok'a bağlanmaz: köprü, kütüphanenin taklitleriyle sınanır.
      - run: node araclar/test.js
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-cikti
          path: test/cikti/
